name: adk-upgrade-check
description: Find code that a google-adk upgrade will break, before you upgrade.
author: Reuben Alex
branding:
  icon: check-circle
  color: blue

inputs:
  path:
    description: Project root to check.
    default: "."
  to:
    description: Target google-adk version, or "latest".
    default: latest
  fail-on:
    description: Lowest severity that fails the step (error, warning, info, never).
    default: error
  sarif:
    description: Also write findings to this SARIF file, for github/codeql-action/upload-sarif.
    default: ""

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
    - name: Check for breaking changes
      shell: bash
      env:
        CHECK_PATH: ${{ inputs.path }}
        CHECK_TO: ${{ inputs.to }}
        CHECK_FAIL_ON: ${{ inputs.fail-on }}
        CHECK_SARIF: ${{ inputs.sarif }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        tool=(uvx --from "$ACTION_PATH" adk-upgrade-check "$CHECK_PATH" --to "$CHECK_TO")
        if [ -n "$CHECK_SARIF" ]; then
          "${tool[@]}" --format sarif --fail-on never > "$CHECK_SARIF"
        fi
        "${tool[@]}" --fail-on "$CHECK_FAIL_ON" --color always
