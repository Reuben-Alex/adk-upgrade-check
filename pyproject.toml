[project]
name = "adk-upgrade-check"
version = "0.2.0"
description = "Find code that a Google ADK (google-adk) upgrade will break, before you upgrade."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "libcst>=1.4",
  "packaging>=23",
  "pyyaml>=6",
]

[project.scripts]
adk-upgrade-check = "adk_upgrade_check.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adk_upgrade_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "ground_truth"]
