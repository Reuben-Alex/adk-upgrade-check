name: Action

# Runs this repository's GitHub Action (action.yml) the way users do.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test:
    name: Action on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Demo project (has breaking changes)
        id: demo
        uses: ./
        continue-on-error: true
        with:
          path: examples/demo
          sarif: demo.sarif

      - name: The step failed and the SARIF lists every finding
        shell: bash
        run: |
          test "${{ steps.demo.outcome }}" = failure
          python -c "import json; r = json.load(open('demo.sarif'))['runs'][0]['results']; assert len(r) == 4, r; print(len(r), 'results')"

      - name: Clean project (no breaking changes)
        uses: ./
        with:
          path: tests/fixtures/ADK119-ASYNC-DB-URL/negative
